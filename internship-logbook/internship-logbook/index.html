<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Internship Logbook | Login</title>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/login.css" />
  </head>

  <body>
    <main class="login-page">
      <section class="login-container">
        <div class="login-header">
          <div class="logo">IL</div>

          <h1>Internship Logbook</h1>

          <p>Sign in to manage your internship activities.</p>
        </div>

        <form class="login-form">
          <div class="form-group">
            <label for="email">Email or Matric Number</label>

            <input
              type="text"
              id="email"
              name="email"
              placeholder="Enter your email or matric number"
            />
          </div>

          <div class="form-group">
            <label for="password">Password</label>

            <div class="password-wrapper">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
              />

              <button type="button" class="password-toggle" id="passwordToggle">
                Show
              </button>
            </div>
          </div>

          <div class="form-options">
            <label class="remember-me">
              <input type="checkbox" name="remember" />
              <span>Remember me</span>
            </label>

            <a href="#">Forgot password?</a>
          </div>

          <button type="submit" class="login-button">Sign In</button>
        </form>

        <div class="login-footer">
          <p>Internship Management System</p>
        </div>
      </section>
    </main>

    <script src="js/login.js"></script>
  </body>
</html>
