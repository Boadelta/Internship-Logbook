<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Internship Logbook | Create Password</title>

<link
  rel="stylesheet"
  href="{{ url_for('static', filename='css/style.css') }}"
/>

<link
  rel="stylesheet"
  href="{{ url_for('static', filename='css/login.css') }}"
/>

  </head>  <body>
    <main class="login-page">
      <section class="login-container">    <div class="login-header">
      <div class="logo">IL</div>

      <h1>Create Your Password</h1>

      <p>
        Activate your account to access the Internship Logbook.
      </p>
    </div>

    <form class="login-form" id="createPasswordForm">

      <div class="form-group">
        <label for="email">Email</label>

        <input
          type="text"
          id="email"
          name="email"
          placeholder="Enter your email"
          required
        />
      </div>

    <div class="form-group">
        <label for="activationCode">Activation Code</label>

        <input
          type="text"
          id="activation_code"
          name="activationCode"
          placeholder="Enter your activation code"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">New Password</label>

        <div class="password-wrapper">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a password"
            required
          />

          <button
            type="button"
            class="password-toggle"
            id="passwordToggle"
          >
            Show
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>

        <div class="password-wrapper">
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="Confirm your password"
            required
          />

          <button
            type="button"
            class="password-toggle"
            id="confirmPasswordToggle"
          >
            Show
          </button>
        </div>
      </div>

      <button type="submit" class="login-button">
        Create Password
      </button>

    </form>

    <div class="login-footer">
      <p>Internship Management System</p>
    </div>

  </section>
</main>
 <script src="{{url_for('static', filename='js/buttonFeature.js')}}">
        </script>
<script src="{{ url_for('static', filename='js/createPassword.js') }}"></script>
     

  </body>
</html>
